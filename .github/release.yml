# Categories for the release notes GitHub generates
# (`gh release create --generate-notes` in .github/workflows/release.yaml).
# This repo keeps no hand-written CHANGELOG, so these headings are the only
# structure a reader gets — every merged pull request lands under one of them.
#
# Only labels that actually exist on this repository are listed. The issue
# templates apply `bug` and `enhancement` automatically; `documentation` and
# `breaking-change` are applied by hand; dependabot applies `dependencies`.
# Anything unlabelled falls through to "Other changes", so a forgotten label
# costs placement, never visibility.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    # First: while the manifest schema is v1alpha1, a v0.x release may require
    # users to rewrite manifests (spec.startOnBoot -> spec.runStrategy and
    # spec.cloudInit.password -> passwordFrom both already happened). That is
    # the one thing a reader must not scroll past, so it leads the notes.
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    # dependabot runs weekly across gomod, github-actions and docker, so
    # without a category of its own it would fill "Other changes" and bury
    # the hand-written work. `github_actions` needs no entry: dependabot
    # applies it alongside `dependencies`, and the first match wins.
    - title: Dependencies
      labels:
        - dependencies
    # Catch-all. Must stay last: the first matching category wins.
    - title: Other changes
      labels:
        - "*"
