name: Feature Request
description: 機能の提案 / Propose a change, after checking it against the project's non-goals
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案をありがとうございます。pvectl はスコープを意図的に狭く保っているため、
        実装の前に **[ADR-005: pvectl の存在理由と非目標](https://github.com/cyokozai/pvectl/blob/main/docs/adr/ADR-005-purpose-and-non-goals.md)**
        を読んで、提案がスコープ内に収まるか確認してください。

        メンテナは 1 名です。大きな Pull Request を投げる前に、この issue で合意を取ってください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / Problem
      description: |
        解決策ではなく、**困っていること**を書いてください。今どう回避しているか、
        なぜそれで不十分かが分かると判断しやすくなります。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する挙動 / Proposed behaviour
      description: |
        マニフェストやコマンドの形が決まっているなら、具体例を貼ってください。
        新しい `spec` フィールドや動詞を足すなら、その名前と意味を明記してください。
      placeholder: |
        spec:
          newField: value

        または: pvectl <verb> <kind> <name> --flag
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 種別 / Category
      options:
        - 既存 kind の spec フィールド追加
        - 新しい resource kind の追加
        - 新しい動詞（命令的操作）の追加
        - 出力・UX の改善
        - ドキュメントの改善
        - その他
    validations:
      required: true

  - type: dropdown
    id: persistence
    attributes:
      label: 持続する状態か、1 回限りの操作か / Desired state or one-shot action
      description: |
        pvectl は「望ましい状態として持続するか」で宣言（`spec`）と命令（動詞）を分けています（ADR-005 §3）。
        どちらに属する提案か選んでください。
      options:
        - 持続する望ましい状態（spec に書くもの）
        - 1 回限りの操作（動詞として提供し spec に痕跡を残さないもの）
        - どちらでもない / 判断できない
    validations:
      required: true

  - type: checkboxes
    id: non-goals
    attributes:
      label: 非目標との照合 / Checked against the non-goals
      description: |
        ADR-005 の「非目標」に触れていないことを確認してください。
        いずれかに該当する提案は、原則として受け入れられません。
      options:
        - label: "中心原理「マニフェストに書いていないフィールドは、pvectl にとって存在しない」に反していない"
          required: true
        - label: ローカル state ファイル（tfstate 相当）を必要としない
          required: true
        - label: 常駐リコンサイル / watch を必要としない
          required: true
        - label: "`--prune` 相当の所有権表明を必要としない"
          required: true
        - label: "`qm` のコマンド体系の網羅を目的としていない（未モデル化のキーは `spec.raw` で足りる）"
          required: true
        - label: ノードローカルの対話操作（qm terminal / monitor / sendkey）ではない
          required: true
        - label: Proxmox クラスタ自体の構築・ノード追加ではない
          required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / Alternatives considered
      description: |
        既存機能での回避（`spec.raw`、既存の動詞、シェルでの組み合わせなど）を検討したか、
        なぜそれで足りないかを書いてください。
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 実装の意思 / Willing to implement
      options:
        - label: 合意が取れれば自分で Pull Request を出すつもりがある
          required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足 / Additional context
      description: 先行例（kubectl / KubeVirt / Terraform provider など）での扱い、参考リンクなど。
    validations:
      required: false
