name: Bug Report
description: pvectl が期待どおりに動かない / Report behaviour that does not match the documented contract
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告をありがとうございます。再現に必要な情報が揃っていると、そのまま回帰テストに落とせます。

        **報告の前に確認してください**

        - 脆弱性は public issue に書かないでください。[SECURITY.md](https://github.com/cyokozai/pvectl/blob/main/SECURITY.md) の手順（GitHub の Private vulnerability reporting）を使ってください
        - マニフェストや出力を貼るときは、API トークン・パスワード・SSH 公開鍵・ホスト名などの秘密を必ず削除してください

  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認 / Preflight
      options:
        - label: 同じ内容の issue が既に無いことを検索して確認した
          required: true
        - label: これは脆弱性報告ではない（脆弱性は SECURITY.md の手順で報告する）
          required: true
        - label: "「マニフェストから消したフィールドがライブ値に戻らない」は仕様であることを理解している（ADR-005 の 2-way merge）"
          required: true

  - type: textarea
    id: summary
    attributes:
      label: バグの概要 / Summary
      description: 何が起きたかを 1〜3 文で説明してください。
    validations:
      required: true

  - type: input
    id: pvectl-version
    attributes:
      label: pvectl のバージョン / pvectl version
      description: "`pvectl version` の出力をそのまま貼ってください。"
      placeholder: "pvectl version v0.1.0 (commit abc1234, built 2026-09-16)"
    validations:
      required: true

  - type: input
    id: pve-version
    attributes:
      label: Proxmox VE のバージョン / Proxmox VE version
      description: "Web UI のフッタ、または `pveversion` の出力。"
      placeholder: "pve-manager/8.2.4/faa83925c9641325 (running kernel: 6.8.8-2-pve)"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: pvectl を実行した環境 / Client platform
      description: OS とアーキテクチャ、インストール方法（`go build` / バイナリ / コンテナ）。
      placeholder: "macOS 15.6 arm64, make build（dev コンテナ内）"
    validations:
      required: true

  - type: textarea
    id: manifest
    attributes:
      label: マニフェスト / Manifest
      description: |
        再現に使ったマニフェストを貼ってください。**秘密（パスワード・トークン・鍵）は削除してから貼ってください。**
        `cloudInit.passwordFrom` の参照先の値は貼らないでください（`env:` / `file:` の参照文字列だけで十分です）。

        例:

        ```yaml
        apiVersion: pve.io/v1alpha1
        kind: VirtualMachine
        metadata:
          name: web-01
        spec:
          targetNode: pve1
          runStrategy: Manual
          resources:
            cpu:
              cores: 2
            memory: 2048
        ```
      render: yaml
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順 / Steps to reproduce
      description: 実行したコマンドを順番に、そのまま貼ってください。
      placeholder: |
        1. pvectl apply -f vm.yaml
        2. pvectl get vm web-01 -o yaml
        3. pvectl diff -f vm.yaml
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した挙動 / Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動 / Actual behaviour
      description: エラーメッセージ、終了コード、差分出力があればそのまま貼ってください。
      render: shell
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足 / Additional context
      description: 関連する issue、回避策、実クラスタ固有の事情など。
    validations:
      required: false
