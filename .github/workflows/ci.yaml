name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref so a burst of pushes does not keep
# stale runs alive. The default branch is exempt: cancelling a run on main
# would leave a gap in the record of what was actually verified on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Total-statement coverage floor for the `test` job. Measured at 62.7% on
  # dev (2026-09-16); 60.0% leaves a little room for churn while still failing
  # on a real regression. Raise it as coverage climbs.
  COVERAGE_MIN: "60.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt failed on:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out |
            awk '$1 == "total:" { gsub(/%/, "", $NF); print $NF }')
          if [ -z "$total" ]; then
            echo "::error::could not read the total from coverage.out"
            exit 1
          fi
          echo "total coverage ${total}% (minimum ${COVERAGE_MIN}%)"
          echo "Total coverage: **${total}%** (minimum ${COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v total="$total" -v min="$COVERAGE_MIN" \
            'BEGIN { exit (total + 0 < min + 0) }'; then
            echo "::error::total coverage ${total}% is below the ${COVERAGE_MIN}% minimum"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history so the Makefile's `git describe` can resolve a real
          # version instead of falling back to the bare commit.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go build
        # HOST=1 keeps the Makefile off `docker compose exec`, so CI exercises
        # the same LDFLAGS injection a local `make build` does.
        run: make build HOST=1
      - name: smoke test
        run: ./pvectl version

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # One runner covers every target: CGO is off, so four `go build`
      # invocations are much cheaper than four runners. The platform list
      # lives in the Makefile (PLATFORMS) next to the LDFLAGS they share.
      - name: cross-compile every platform
        run: make cross-build HOST=1
      - name: inspect artifacts
        run: |
          ls -l dist/
          file dist/*
      # Only the runner's own platform can actually be executed, so the
      # `pvectl version` smoke test stays in the `build` job.

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # @latest on purpose: the analysis is only as good as the tool, and the
      # vulnerability database is fetched at run time regardless of the pin.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # A single scan feeds both the report and the gate. Run
      # `govulncheck ./...` locally for the full call traces.
      - name: scan
        run: govulncheck -format json ./... > govulncheck.json
      # Gate on findings this repo's own code actually reaches (symbol level)
      # in third-party modules. Standard-library findings are reported but do
      # not fail the job: they are a property of the toolchain that go.mod's
      # `go` directive pins, not of anything reviewable in a pull request, so
      # blocking on them would leave CI permanently red.
      - name: gate on called third-party vulnerabilities
        run: |
          jq -r '
            select(.finding)
            | select(.finding.trace[0].function != null)
            | [ .finding.trace[0].module,
                .finding.osv,
                (.finding.trace[0].version // "?"),
                (.finding.fixed_version // "n/a") ]
            | @tsv
          ' govulncheck.json | sort -u > called.tsv

          : > stdlib.md
          : > third-party.md
          awk -F'\t' '
            { line = sprintf("- %s in %s@%s (fixed in %s)", $2, $1, $3, $4) }
            $1 == "stdlib" { print line > "stdlib.md"; next }
            { print line > "third-party.md" }
          ' called.tsv

          {
            echo "## govulncheck"
            echo
            if [ -s third-party.md ]; then
              echo "### Called vulnerabilities in dependencies (blocking)"
              cat third-party.md
            else
              echo "### No called vulnerabilities in dependencies"
            fi
            echo
            if [ -s stdlib.md ]; then
              echo "### Standard library (informational)"
              echo "Fixed by raising the \`go\` directive in go.mod."
              cat stdlib.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          cat stdlib.md third-party.md

          while read -r line; do
            echo "::warning::standard library: ${line#- } - raise go.mod's go directive"
          done < stdlib.md

          if [ -s third-party.md ]; then
            while read -r line; do
              echo "::error::called vulnerability in a dependency: ${line#- }"
            done < third-party.md
            exit 1
          fi
