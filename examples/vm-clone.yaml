# Clone-based creation: the VM is cloned from a template, then the
# declared resources / networks / cloud-init are applied on top.
# Disks are inherited from the source (declaring them here only warns).
apiVersion: pve.io/v1alpha1
kind: VirtualMachine
metadata:
  name: app-server
  labels:
    env: production
spec:
  targetNode: pve-node1
  clone: ubuntu-template
  fullClone: true
  pool: production
  description: "Production app server (cloned)"
  resources:
    cpu:
      cores: 4
    memory: 8192
  networks:
    - name: net0
      bridge: vmbr0
      model: virtio
      tag: 100
  cloudInit:
    user: ubuntu
    sshKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... user@example.com"
    ipConfig: "ip=10.0.100.20/24,gw=10.0.100.1"
    nameserver: 10.0.100.1
  startOnBoot: true
  tags:
    - production
    - app
