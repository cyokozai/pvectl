# Every LinuxContainer spec field, annotated. See
# docs/quick-start/linuxcontainer.md for what apply does with each one.
apiVersion: pve.io/v1alpha1
kind: LinuxContainer
metadata:
  # The container's hostname. There is no separate spec.hostname.
  name: web-01
spec:
  # Required. The node the container lives on. Immutable after creation.
  targetNode: pve1
  # Optional. Pins the numeric id (>= 100); next free id when omitted.
  vmid: 200
  # Required, true or false. Proxmox creates a privileged container when
  # it is omitted, and it cannot be changed after creation.
  unprivileged: true
  # Where the root filesystem comes from. Create-time only: it is never
  # compared against the running container, and get -o yaml leaves it out.
  osTemplate:
    # A template already on the node's storage, as storage:vztmpl/file.
    volid: local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
    # Or let pvectl download it once (exclusive with volid). The file is
    # stored as pvectl-<first 16 digits of sha256>-<file name>, and only
    # downloaded when that name is not on the storage yet. Proxmox checks
    # the digest; copy the real one from the template's publisher.
    #   url: https://download.example.test/debian-12-standard_12.7-1_amd64.tar.zst
    #   sha256: <64 hex digits>
    #   storage: local
  # Optional. Assign to a resource pool. Create-time only.
  pool: demo-pool
  description: "Kitchen-sink example"
  resources:
    cores: 2
    memory: 1024      # MiB
    swap: 512         # MiB; 0 means no swap
  rootfs:
    storage: local-lvm
    size: 8G          # grows are applied via resize; shrinking errors
  mountPoints:
    - name: mp0       # slot: mp0, mp1 ...
      storage: local-lvm
      size: 32G
      path: /data     # mount point inside the container
  networks:
    - name: net0      # interface slot
      interface: eth0 # name inside the container; default eth<N> for net<N>
      bridge: vmbr0
      ip: 10.0.0.50/24  # dhcp | manual | a CIDR
      gw: 10.0.0.1
      # VLAN tag 1-4094. 0 declares "untagged" and removes a live tag;
      # leaving it out leaves the tag unmanaged.
      tag: 100
      # hwaddr is generated by Proxmox and kept across updates; write it
      # only to pin a MAC address.
  nameserver: 10.0.0.53
  # Only the flags written here are managed; the others stay as they are.
  features:
    nesting: true
    keyctl: true
  # Initial root credentials. Sent once at creation and never compared,
  # updated, or exported: Proxmox does not keep them in the config.
  root:
    # Referenced, never written here: env:VARIABLE or file:/path/to/file.
    passwordFrom: env:CT_ROOT_PASSWORD
    sshKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... admin@example.test"
  # Desired power state apply converges to:
  #   Manual (default) — apply never touches the power state
  #   Always           — onboot=1, and apply starts the container if stopped
  #   Halted           — onboot=0, and apply stops the container if running
  runStrategy: Always
  tags:
    - demo
  # Escape hatch for Proxmox API config keys pvectl does not model yet,
  # such as bind mounts. Declaring a key generated above is an error.
  raw:
    startup: "order=2"
