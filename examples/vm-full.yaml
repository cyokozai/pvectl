# Every VirtualMachine spec field, annotated.
apiVersion: pve.io/v1alpha1
kind: VirtualMachine
metadata:
  name: full-example
  labels:
    app: demo
  annotations:
    owner: platform-team
spec:
  # Required. The node the VM lives on. Immutable after creation.
  targetNode: pve-node1
  # Optional. Pins the numeric id (>= 100); next free id when omitted.
  vmid: 4200
  # Optional. Assign to a resource pool. Create-time only.
  pool: demo-pool
  description: "Kitchen-sink example"
  resources:
    cpu:
      cores: 4        # required unless cloning
      sockets: 1
      type: host      # emulated CPU type, e.g. host / kvm64
    memory: 8192      # MB, required unless cloning
  disks:
    - name: scsi0     # bus slot: scsi0, virtio0, sata0, ide0 ...
      size: 64G       # grows are applied via resize; shrinking errors
      storage: local-lvm
      format: qcow2   # immutable after creation
      cache: writeback
  networks:
    - name: net0      # interface slot
      bridge: vmbr0
      model: virtio   # default virtio
      tag: 100        # VLAN tag
  cloudInit:
    user: admin
    password: change-me   # write-only: set on create, never diffed
    sshKeys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... admin@example.com"
    ipConfig: "ip=10.0.0.50/24,gw=10.0.0.1"
    nameserver: 1.1.1.1
    storage: local-lvm    # cloud-init drive storage (defaults to first disk's)
  startOnBoot: true
  tags:
    - demo
    - full
